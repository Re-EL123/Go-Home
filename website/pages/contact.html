<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Re-EL - Book Consultation & Service Enquiry</title>
    <meta name="description" content="Get in touch with Re-EL. Book a consultation or submit a service enquiry for software development, branding, or design services.">
    <link rel="icon" href="../public/assets/images/celebrate.png" type="image/png">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide@latest/dist/lucide.min.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
</head>
<body>
    <!-- Navigation Header -->
    <header>
        <div class="header-container">
            <div class="logo">
                <img src="../public/assets/images/logo-no-bg.png" alt="Re-EL" style="height: 40px; width: auto; display: inline;">
                <span style="margin-left: 8px; vertical-align: middle;">Re-EL</span>
            </div>
            <nav>
                <a href="homepage.html">Home</a>
                <a href="homepage.html#services">Services</a>
                <a href="homepage.html#portfolio">Portfolio</a>
                <a href="about.html">About</a>
                <a href="contact.html" class="cta-button">Contact</a>
            </nav>
        </div>
    </header>

    <main style="padding-top: 80px;">
        <!-- Hero Section -->
        <section class="section section-gradient" style="min-height: 400px; display: flex; align-items: center;">
            <div class="container">
                <h1 style="margin-bottom: 1.5rem; text-align: center;">Let's Work Together</h1>
                <p style="text-align: center; font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 0;">Whether you have questions about our services or want to discuss your project, we're here to help.</p>
            </div>
        </section>

        <!-- Contact Section -->
        <section class="section section-light">
            <div class="container">
                <div style="max-width: 900px; margin: 0 auto;">
                    <h2 style="text-align: center; margin-bottom: 3rem;">Service Enquiry Form</h2>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: start;">
                        <!-- Contact Form -->
                        <div class="card">
                            <h3 style="margin-bottom: 2rem;">Tell us about your project</h3>
                            <form id="enquiryForm" onsubmit="submitToWhatsApp(event)">
                                <!-- Name -->
                                <div class="form-group">
                                    <label>Your Full Name *</label>
                                    <input type="text" id="name" name="name" required placeholder="John Doe">
                                </div>

                                <!-- Email -->
                                <div class="form-group">
                                    <label>Email Address *</label>
                                    <input type="email" id="email" name="email" required placeholder="john@company.com">
                                </div>

                                <!-- Phone -->
                                <div class="form-group">
                                    <label>Phone Number</label>
                                    <input type="tel" id="phone" name="phone" placeholder="+27813864024">
                                </div>

                                <!-- Company -->
                                <div class="form-group">
                                    <label>Company Name</label>
                                    <input type="text" id="company" name="company" placeholder="Your Company">
                                </div>

                                <!-- Service Type -->
                                <div class="form-group">
