                </svg>
            </div>
        </div>

    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loader {
            --path: #ffffff;
            --dot: #ffffff;
            --duration: 3s;
            width: 44px;
            height: 44px;
            position: relative;
            display: inline-block;
        }
        .loader:before {
            content: "";
            width: 6px; height: 6px; border-radius: 50%;
            position: absolute; display: block;
            background: var(--dot);
            top: 37px; left: 19px;
            transform: translate(-18px, -18px);
            animation: dotRect var(--duration) cubic-bezier(0.785,0.135,0.15,0.86) infinite;
        }
        .loader svg { display: block; width: 100%; height: 100%; }
        .loader svg rect {
            fill: none; stroke: var(--path); stroke-width: 10px;
            stroke-linejoin: round; stroke-linecap: round;
            stroke-dasharray: 192 64 192 64; stroke-dashoffset: 0;
            animation: pathRect 3s cubic-bezier(0.785,0.135,0.15,0.86) infinite;
        }
        @keyframes pathRect {
            25% { stroke-dashoffset: 64; }
            50% { stroke-dashoffset: 128; }
            75% { stroke-dashoffset: 192; }
            100% { stroke-dashoffset: 256; }
        }
        @keyframes dotRect {
            25% { transform: translate(0,0); }
            50% { transform: translate(18px,-18px); }
            75% { transform: translate(0,-36px); }
            100% { transform: translate(-18px,-18px); }
        }
    </style>
