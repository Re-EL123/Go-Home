<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="3; url=https://www.re-el-branding.rf.gd/website/index.html" />
  <meta name="description" content="Re-EL Branding helps businesses grow with professional branding, web development, and digital marketing solutions tailored for South Africa." />

  <title>Re-EL | Loading...</title>

  <style>
    /* ===== Reset & Base ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      height: 100vh;
      background-color: #0b0c10;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: "Poppins", sans-serif;
      color: #fdd835;
      overflow: hidden;
    }

    /* ===== Logo ===== */
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: pulse-glow 1.5s ease-in-out infinite;
    }
    .logo-container img {
      width: 120px;
      height: auto;
      margin-bottom: 15px;
      filter: drop-shadow(0 0 10px #fdd835);
      transition: filter 0.3s ease-in-out;
    }
    .logo-text {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 2px;
    }
    .tagline {
      font-size: 0.9rem;
      color: #fdd835;
      opacity: 0.8;
      margin-top: 8px;
      font-style: italic;
    }

    /* ===== Uiverse Loader (recolored Re-EL navy/yellow) ===== */
    .loader {
      --path: #0b0c10;
      --dot: #fdd835;
      --duration: 3s;
      width: 44px;
      height: 44px;
      position: relative;
      margin-top: 30px;
    }
    .loader:before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      position: absolute;
      display: block;
      background: var(--dot);
      top: 37px;
      left: 19px;
      transform: translate(-18px, -18px);
      animation: dotRect var(--duration) cubic-bezier(0.785, 0.135, 0.15, 0.86) infinite;
    }
    .loader svg { display: block; width: 100%; height: 100%; }
    .loader svg rect,
    .loader svg polygon,
    .loader svg circle {
      fill: none;
      stroke: var(--path);
      stroke-width: 10px;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .loader svg rect {
      stroke-dasharray: 192 64 192 64;
      stroke-dashoffset: 0;
      animation: pathRect 3s cubic-bezier(0.785, 0.135, 0.15, 0.86) infinite;
    }
    @keyframes pathRect {
      25% { stroke-dashoffset: 64; }
      50% { stroke-dashoffset: 128; }
      75% { stroke-dashoffset: 192; }
      100% { stroke-dashoffset: 256; }
    }
    @keyframes dotRect {
      25% { transform: translate(0, 0); }
      50% { transform: translate(18px, -18px); }
      75% { transform: translate(0, -36px); }
      100% { transform: translate(-18px, -18px); }
    }
    .loader { display: inline-block; margin: 0 16px; }

    /* Pulse glow synced with spinner */
    @keyframes pulse-glow {
      0% {
        opacity: 0.8;
        text-shadow: 0 0 10px #fdd835, 0 0 20px #fdd835;
        filter: drop-shadow(0 0 10px #fdd835);
      }
      50% {
        opacity: 1;
        text-shadow: 0 0 25px #fdd835, 0 0 40px #fdd835;
        filter: drop-shadow(0 0 25px #fdd835);
      }
      100% {
        opacity: 0.8;
        text-shadow: 0 0 10px #fdd835, 0 0 20px #fdd835;
        filter: drop-shadow(0 0 10px #fdd835);
      }
    }

    /* ===== Fade in Effect ===== */
    .fade-in {
      animation: fadeIn 1.2s ease forwards;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== South Cliff inspired accents (colours unchanged) ===== */
    .eyebrow {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #fdd835;
      margin-bottom: 1.2rem;
      opacity: 0.85;
      animation: fadeIn 1.2s ease forwards;
    }
    .star-accent {
      font-size: 2rem;
      color: #fdd835;
      line-height: 1;
      margin-bottom: 0.5rem;
      position: relative;
      display: inline-block;
    }
    .star-accent .star-particle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fdd835;
      opacity: 0;
      transform: translate(-50%, -50%);
      animation: pulseParticle 2.4s ease-out infinite;
    }
    .star-accent .star-particle:nth-child(2) { animation-delay: 0.4s; }
    .star-accent .star-particle:nth-child(3) { animation-delay: 0.8s; }
    .star-accent .star-particle:nth-child(4) { animation-delay: 1.2s; }
    .star-accent .star-particle:nth-child(5) { animation-delay: 1.6s; }
    @keyframes pulseParticle {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
      40%  { opacity: 0.9; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(2.6) translateY(-14px); }
    }
    .tagline { letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="logo-container fade-in">
    <span class="star-accent"><span class="star-particle"></span><span class="star-particle"></span><span class="star-particle"></span><span class="star-particle"></span><span class="star-particle"></span></span>
    <div class="eyebrow">Digital Branding Agency · South Africa</div>
    <img src="logo.jpg" alt="Re-EL Logo" />
    <div class="logo-text">Re-EL</div>
    <div class="tagline">“DESIGNS THAT LIGHT UP YOUR BRAND”</div>
  </div>

  <div class="loader" aria-label="Loading">
    <svg viewBox="0 0 44 44">
      <rect x="2" y="2" width="40" height="40" rx="4"></rect>
    </svg>
  </div>
</body>
</html>
